<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4FA; --ink:#1E2230; --muted:#5B6275;
  --btn:#FFFFFF; --btn-line:#D3D9E6;
  --paper:#FFFFFF; --guide:#EDA59D; --stamp:#D4213A; --stamp-back:#FFFFFF;
  --shadow:rgba(30,34,48,.22); --focus:#3D6FD9;
  --sky:#CFE4FA; --sky2:#F1F7FE;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151824; --ink:#EEF0F6; --muted:#A3A9BA;
    --btn:#242A3B; --btn-line:#3A4258;
    --paper:#ECEEF3; --guide:#DE958C; --stamp:#E8344C; --stamp-back:#F4F5F8;
    --shadow:rgba(0,0,0,.5); --focus:#8DB0FF;
    --sky:#22304A; --sky2:#171D2C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151824; --ink:#EEF0F6; --muted:#A3A9BA;
  --btn:#242A3B; --btn-line:#3A4258;
  --paper:#ECEEF3; --guide:#DE958C; --stamp:#E8344C; --stamp-back:#F4F5F8;
  --shadow:rgba(0,0,0,.5); --focus:#8DB0FF;
  --sky:#22304A; --sky2:#171D2C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none !important}
.stamp-svg{color:var(--stamp)}
h1,h2{font-weight:400;margin:0;line-height:1.1}

/* 공통 머리 */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head-left{display:flex;align-items:center;gap:12px;min-width:0}
.tally{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--stamp);white-space:nowrap}
.tally svg{width:38px;height:38px;transform:rotate(-14deg)}
.icon-btn{display:grid;place-items:center;flex:none;width:56px;height:56px;padding:0;border-radius:50%;border:2px solid var(--btn-line);background:var(--btn)}
.icon-btn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.reset{display:block;margin:40px auto 0;padding:10px;background:none;border:0;color:var(--muted);font-size:16px;text-decoration:underline;text-underline-offset:4px}

/* 처음 화면: 묶음 */
#home{max-width:640px;margin:0 auto;padding:22px 18px 36px}
#home h1{font-size:36px}
.hint{margin:8px 0 24px;color:var(--muted);font-size:19px}
.groups{list-style:none;margin:0;padding:0;display:grid;gap:20px}
.group{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;min-height:112px;padding:16px 20px;border:0;border-radius:5px;background:var(--c);color:#fff;text-align:left;box-shadow:3px 4px 0 var(--shadow);transform:rotate(var(--tilt));transition:transform .12s ease-out}
.group:active{transform:rotate(var(--tilt)) scale(.97)}
.gname{display:block;font-size:29px}
.gprog{display:block;margin-top:6px;font-size:17px;opacity:.92}
.samples{display:flex;gap:4px}
.samples svg{width:50px;height:50px;fill:#fff}
.group .mini{position:absolute;right:-10px;top:-12px;width:52px;height:52px;transform:rotate(-14deg)}

/* 묶음 화면: 글자 카드 */
#group{max-width:780px;margin:0 auto;padding:16px 18px 36px}
#group h2{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:20px 16px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;aspect-ratio:1;padding:10px 8px 12px;border:0;border-radius:5px;background:var(--c);color:#fff;box-shadow:3px 4px 0 var(--shadow);transform:rotate(var(--tilt));transition:transform .12s ease-out}
.card:active{transform:rotate(var(--tilt)) scale(.95)}
.card .glyph{width:62%;height:auto;fill:#fff}
.card .hun{font-size:21px;margin-top:2px;white-space:nowrap}
.card .mini{position:absolute;right:-9px;bottom:-11px;width:54px;height:54px;transform:rotate(-14deg)}

/* 글자 화면 */
#learn{max-width:460px;margin:0 auto;padding:16px 18px 32px}
.dots{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;list-style:none;margin:0;padding:0;max-width:240px}
.dots li{width:11px;height:11px;border-radius:50%;background:var(--btn-line)}
.dots li.done{background:var(--stamp)}
.dots li.now{outline:3px solid var(--c);outline-offset:2px}
.notice{margin:16px 0 0;padding:10px 14px;border-radius:12px;background:var(--btn);border:2px solid var(--btn-line);color:var(--ink);font-size:17px;line-height:1.45}
.stage{display:flex;justify-content:center;margin-top:16px}
.board{position:relative;background:var(--paper);border:5px solid var(--c);border-radius:8px;box-shadow:4px 5px 0 var(--shadow)}
.board .guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board #writer{position:relative;touch-action:none}
.board #writer svg{display:block}
.big-stamp{position:absolute;right:-6px;bottom:-16px;width:42%;aspect-ratio:1;pointer-events:none;transform:rotate(-14deg);opacity:.95;z-index:2}
.big-stamp svg{display:block;width:100%;height:100%}
.big-stamp.on{animation:thunk .45s cubic-bezier(.2,1.5,.45,1) both}
@keyframes thunk{0%{opacity:0;transform:scale(2.3) rotate(-2deg)}55%{opacity:1}100%{opacity:.95;transform:scale(1) rotate(-14deg)}}
.board.hit{animation:hit .22s .28s ease-out}
@keyframes hit{50%{transform:translateY(4px)}}
.say{display:flex;align-items:center;justify-content:center;gap:12px;min-height:66px;margin:24px auto 0;padding:8px 28px;border-radius:999px;border:2px solid var(--btn-line);background:var(--btn);font-size:34px;line-height:1}
.say svg{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mode{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:14px;border:2px solid var(--btn-line);background:var(--btn);font-size:23px}
.mode svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mode[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.pic{display:grid;justify-content:center;align-content:center;gap:4px 8px;width:100%;min-height:76px;margin-top:18px;padding:12px 10px;border:2px dashed var(--btn-line);border-radius:16px;background:none;font-size:34px;line-height:1.15;font-family:var(--emoji)}
.pic.one{font-size:58px}
.pic span{display:inline-block;transition:transform .14s ease-out}
.pic span.pop{transform:scale(1.5)}
.pager{display:flex;justify-content:space-between;margin-top:22px}
.pager .icon-btn{width:66px;height:66px}
.pager .go{background:var(--c);border-color:var(--c);color:#fff}
.pager button:disabled{opacity:.28;cursor:default}

/* 첫 화면: 게임 문 */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:150px;margin:4px 0 34px;padding:20px 20px 20px 22px;border:0;border-radius:16px;background:linear-gradient(var(--sky),var(--sky2));color:var(--ink);text-align:left;box-shadow:3px 4px 0 var(--shadow)}
.hero b{display:block;font-size:29px;font-weight:400;line-height:1.2;word-break:keep-all}
.hero .sub{display:block;margin-top:8px;font-size:16px;line-height:1.45;color:var(--muted);word-break:keep-all}
.hero .go{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:#E5484D;color:#fff;font-size:19px;white-space:nowrap}
.hero > span:first-child{flex:1 1 auto;min-width:0}
@media (max-width:380px){.mb{width:44px;height:54px}.mb::after{height:16px}.hero{padding:18px 14px 18px 18px}.hero b{font-size:26px}}
.hero:active{transform:scale(.98)}
.hero-bals{display:flex;align-items:flex-start;gap:4px;flex:none;padding-top:6px}
.mb{position:relative;display:grid;place-items:center;width:54px;height:66px;border-radius:50% 50% 47% 47% / 56% 56% 44% 44%;background:var(--c);animation:bob 2.4s ease-in-out infinite alternate}
.mb::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:22px;background:var(--muted);opacity:.5}
.mb:nth-child(2){margin-top:-14px;animation-delay:-.8s}
.mb:nth-child(3){animation-delay:-1.6s}
.mb .glyph{width:62%;height:auto;fill:#fff}
@keyframes bob{from{transform:translateY(5px) rotate(-4deg)}to{transform:translateY(-6px) rotate(4deg)}}
.sec{margin:0;font-size:26px;font-weight:400}

/* 묶음 화면 게임 버튼 */
.play{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:68px;margin-top:22px;border:0;border-radius:5px;background:var(--c);color:#fff;font-size:25px;box-shadow:3px 4px 0 var(--shadow)}
.play svg{width:34px;height:34px;flex:none}
.play:active{transform:scale(.98)}

/* 게임 고르기 */
#gmenu{max-width:640px;margin:0 auto;padding:16px 18px 36px}
#gmenu h2{font-size:28px}
#gmenu .groups{margin-top:24px}

/* 풍선 터뜨리기 */
#game{max-width:520px;margin:0 auto;padding:16px 18px 24px}
.g-top{display:flex;align-items:center;gap:16px;margin-top:14px}
.listen{flex:none;display:grid;place-items:center;width:76px;height:76px;padding:0;border:0;border-radius:50%;background:var(--c);color:#fff;box-shadow:3px 4px 0 var(--shadow)}
.listen svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.listen:active{transform:scale(.94)}
.g-hint{margin:0;font-size:19px;line-height:1.4;color:var(--muted)}
.field{position:relative;height:min(64vh,540px);margin-top:14px;overflow:hidden;border-radius:16px;background:linear-gradient(var(--sky),var(--sky2))}
.bal{position:absolute;top:100%;width:108px;height:160px;margin-left:-54px;padding:0;border:0;background:none;animation-name:rise;animation-timing-function:linear;animation-fill-mode:forwards;transition:opacity .4s}
@keyframes rise{from{top:100%}to{top:-170px}}
.bal-body{position:relative;display:grid;place-items:center;width:108px;height:128px;border-radius:50% 50% 47% 47% / 56% 56% 44% 44%;background:var(--c);box-shadow:inset -10px -14px 0 rgba(0,0,0,.13),inset 10px 10px 0 rgba(255,255,255,.13);animation:sway 2.6s ease-in-out infinite alternate}
.bal-body::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid var(--c)}
.bal::after{content:"";position:absolute;left:50%;top:136px;width:2px;height:24px;background:var(--muted);opacity:.5}
.bal .glyph{width:62%;height:auto;fill:#fff}
@keyframes sway{from{transform:translateX(-7px) rotate(-4deg)}to{transform:translateX(7px) rotate(4deg)}}
.bal.sad{opacity:.3;pointer-events:none}
.bal.popped{animation-play-state:paused}
.bal.popped .bal-body{animation:pop .26s ease-out forwards}
.bal.popped::after{opacity:0}
.bal.bye{opacity:0;pointer-events:none}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--c);pointer-events:none;animation:spark .5s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.g-end{text-align:center;padding-top:40px}
.g-end .gst{display:block;width:190px;height:190px;margin:0 auto;transform:rotate(-14deg)}
.g-end .gst.on{animation:thunk .45s cubic-bezier(.2,1.5,.45,1) both}
.g-score{margin:24px 0 0;font-size:24px;line-height:1.5}
.g-acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.g-acts button{min-height:60px;border-radius:14px;border:2px solid var(--btn-line);background:var(--btn);font-size:22px}
.g-acts .main{background:var(--c);border-color:var(--c);color:#fff}

@media (prefers-reduced-motion: reduce){
  .mb,.bal-body{animation:none}
  .g-end .gst.on{animation:none}
}

@media (prefers-reduced-motion: reduce){
  .big-stamp.on,.board.hit{animation:none}
  .card,.group,.pic span{transition:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="stamp" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="57" style="fill:var(--stamp-back)"/>
    <circle cx="60" cy="60" r="51" fill="none" stroke="currentColor" stroke-width="6"/>
    <circle cx="60" cy="60" r="43" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="60" y="55" text-anchor="middle" font-size="27" fill="currentColor" style="font-family:var(--font)">참</text>
    <text x="60" y="82" text-anchor="middle" font-size="19" fill="currentColor" style="font-family:var(--font)">잘했어요</text>
  </symbol>
</svg>

<main id="home">
  <header class="head">
    <h1>한자 놀이</h1>
    <div class="tally" id="tally"><svg class="stamp-svg" viewBox="0 0 120 120" aria-hidden="true"><use href="#stamp" xlink:href="#stamp"/></svg><span id="tallyNum">0</span></div>
  </header>
  <p class="hint">오늘은 뭐 하고 놀까?</p>
  <button class="hero" id="gameDoor" type="button">
    <span><b>풍선 터뜨리기</b><span class="sub">소리를 듣고 맞는 한자 풍선을 터뜨려요</span><span class="go">게임 하기</span></span>
    <span class="hero-bals" id="heroBals" aria-hidden="true"></span>
  </button>
  <h2 class="sec">글자 배우기</h2>
  <p class="hint" style="margin-top:6px">묶음을 골라 따라 써 보세요</p>
  <ol class="groups" id="groups"></ol>
  <button class="reset" id="reset" type="button">도장 모두 지우기</button>
</main>

<section id="group" hidden>
  <header class="head">
    <div class="head-left">
      <button class="icon-btn" id="toHome" type="button" aria-label="처음으로">
        <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/></svg>
      </button>
      <h2 id="groupName"></h2>
    </div>
    <div class="tally" id="gTally"><svg class="stamp-svg" viewBox="0 0 120 120" aria-hidden="true"><use href="#stamp" xlink:href="#stamp"/></svg><span id="gTallyNum"></span></div>
  </header>
  <button class="play" id="playBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="9" rx="6.5" ry="7.5" fill="currentColor"/><path d="M12 16.5l-1.6 2h3.2z" fill="currentColor"/><path d="M12 18.5c0 2-1.5 2.5-1.5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>풍선 터뜨리기</button>
  <ol class="cards" id="cards"></ol>
</section>

<section id="learn" hidden>
  <header class="head">
    <button class="icon-btn" id="toGroup" type="button" aria-label="글자 목록으로">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
    </button>
    <ol class="dots" id="dots" aria-hidden="true"></ol>
  </header>
  <p class="notice" id="notice" hidden></p>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <svg class="guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="50" y1="0" x2="50" y2="100" style="stroke:var(--guide)" stroke-width=".6" stroke-dasharray="2.4 2"/>
        <line x1="0" y1="50" x2="100" y2="50" style="stroke:var(--guide)" stroke-width=".6" stroke-dasharray="2.4 2"/>
      </svg>
      <div id="writer"></div>
      <div class="big-stamp" id="bigStamp" hidden aria-hidden="true"><svg class="stamp-svg" viewBox="0 0 120 120"><use href="#stamp" xlink:href="#stamp"/></svg></div>
    </div>
  </div>
  <button class="say" id="say" type="button">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    <span id="sayText"></span>
  </button>
  <div class="modes">
    <button class="mode" id="watchBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>보기
    </button>
    <button class="mode" id="traceBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13.5 6.5l4 4"/></svg>따라 쓰기
    </button>
  </div>
  <button class="pic" id="pic" type="button"></button>
  <nav class="pager">
    <button class="icon-btn" id="prev" type="button" aria-label="앞 글자">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="next" type="button" aria-label="다음 글자">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</section>

<section id="gmenu" hidden>
  <header class="head">
    <div class="head-left">
      <button class="icon-btn" id="gmHome" type="button" aria-label="처음으로">
        <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/></svg>
      </button>
      <h2>어떤 글자로 할까?</h2>
    </div>
  </header>
  <ol class="groups" id="gmGroups"></ol>
</section>

<section id="game" hidden>
  <header class="head">
    <button class="icon-btn" id="gameBack" type="button" aria-label="그만하기">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
    <ol class="dots" id="gDots" aria-hidden="true"></ol>
  </header>
  <div id="gStage">
    <div class="g-top">
      <button class="listen" id="listen" type="button" aria-label="다시 듣기"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <p class="g-hint">소리를 듣고<br>맞는 풍선을 터뜨려요</p>
    </div>
    <div class="field" id="field"></div>
  </div>
  <div class="g-end" id="gEnd" hidden>
    <svg class="gst stamp-svg" id="gStamp" viewBox="0 0 120 120" aria-hidden="true"><use href="#stamp" xlink:href="#stamp"/></svg>
    <p class="g-score" id="gScore"></p>
    <div class="g-acts">
      <button class="main" id="again" type="button">한 번 더</button>
      <button id="toList" type="button">그만하기</button>
    </div>
  </div>
</section>

try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

let voiceCount = 0;
let ttsUnlocked = false;
let voiceChecked = false;
let lastCancel = 0;
function pickVoice() {
  try {

    koVoice = vs.find(v => /^ko/i.test(v.lang)) || null;
  } catch (e) {}
}

}

const NO_VOICE = '이 화면에서는 목소리가 나오지 않아요. 크롬이나 사파리 같은 인터넷 앱에서 열어 주세요.';
const NO_KOREAN = '이 폰에는 한국어 읽기 음성이 없어요. 설정의 텍스트 음성 변환(TTS)에서 한국어를 추가해 주세요.';

  if (!hasTTS) { note(NO_VOICE); return; }
  setTimeout(() => {
    pickVoice();
    if (!voiceCount) note(NO_VOICE);
    else if (!koVoice) note(NO_KOREAN);
  }, 2500);
}
function unlockTTS() {
  if (ttsUnlocked || !hasTTS) return;
  ttsUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    u.lang = 'ko-KR';
    speechSynthesis.speak(u);
  } catch (e) {}
}

  if (!hasTTS) return;

}
function speak(text) {
  if (!hasTTS) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if (koVoice) u.voice = koVoice;
    u.rate = 0.85;
    u.pitch = 1.15;

    if (Date.now() - lastCancel < 90) setTimeout(() => speechSynthesis.speak(u), 90);

  } catch (e) {}
}

/* 효과음 */
let ac = null;
function audio() {

  } catch (e) { ac = null; }

}
function tone(freq, dur, type, when, vol) {
  const a = audio();

  try {
    const o = a.createOscillator(), g = a.createGain();
    const t0 = a.currentTime + (when || 0);
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
const blip = () => tone(880, 0.13, 'sine', 0, 0.15);
const boop = () => tone(196, 0.2, 'triangle', 0, 0.1);
const chime = () => [660, 880, 1175, 1320].forEach((f, i) => tone(f, 0.3, 'sine', i * 0.09, 0.13));
function unlockAll() {
  const a = audio();
  if (a) decodeAll();
  if (a) {
    try {
      const s = a.createBufferSource();
      s.buffer = a.createBuffer(1, 1, 22050);
      s.connect(a.destination);
      s.start(0);
    } catch (e) {}
  }
  unlockTTS();
}

/* 녹음 목소리 */
const buffers = {};
let decoding = null;
let clipNow = null;
let sayRun = 0;
function b64ToBuf(str) {
  const bin = atob(str), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
function decodeAll() {
  if (decoding) return decoding;
  const a = audio();
  if (!a) return null;
  decoding = Promise.all(Object.keys(CLIPS).map(k => new Promise(res => {
    try {
      const r = a.decodeAudioData(b64ToBuf(CLIPS[k]), b => { buffers[k] = b; res(); }, () => res());
      if (r && r.catch) r.catch(() => res());
    } catch (e) { res(); }
  })));
  return decoding;
}
function stopClip() {
  sayRun++;
  if (clipNow) { try { clipNow.stop(); } catch (e) {} clipNow = null; }
}
function playClip(key) {
  const a = audio(), b = buffers[key];
  if (!a || !b) return false;
  if (clipNow) { try { clipNow.stop(); } catch (e) {} }
  const s = a.createBufferSource();
  s.buffer = b;
  s.connect(a.destination);
  s.onended = () => { if (clipNow === s) clipNow = null; };
  s.start();
  clipNow = s;
  return true;
}
function say(key, text) {
  const run = ++sayRun;
  if (playClip(key)) return;
  const p = decodeAll();
  if (p) p.then(() => { if (run === sayRun && !playClip(key)) { checkVoices(); speak(text); } });
  else { checkVoices(); speak(text); }
}

function measure() {

function buildWriter(force) {

    spans.forEach(s => s.classList.add('pop'));
    setTimeout(() => spans.forEach(s => s.classList.remove('pop')), 260);
    say(it.c, it.hun + ', ' + it.eum);
    return;
  }
  const run = ++countRun;
  spans.forEach(s => s.classList.remove('pop'));
  spans.forEach((s, k) => setTimeout(() => {
    if (run !== countRun) return;
    spans.forEach(x => x.classList.remove('pop'));
    s.classList.add('pop');
    say('c' + k, COUNT[k]);
    if (k === spans.length - 1) setTimeout(() => { if (run === countRun) s.classList.remove('pop'); }, 600);
  }, k * 760));
}


/* 풍선 터뜨리기 */
let game = null;
let gameRun = 0;
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function startGame(g, from) {
  stopAll();
  gi = g;
  const items = GROUPS[g].items;
  const qs = shuffle(items).slice(0, Math.min(5, items.length)).map(it => ({ it, first: true, solved: false }));
  game = { qs, n: 0, score: 0, from: from || 'group' };
  $('game').style.setProperty('--c', GROUPS[g].color);
  $('gEnd').hidden = true;
  $('gStage').hidden = false;
  show('game');
  round();
}
function round() {
  const run = ++gameRun, q = game.qs[game.n], items = GROUPS[gi].items, f = $('field');
  q.solved = false;
  renderGDots();
  const opts = shuffle([q.it].concat(shuffle(items.filter(x => x !== q.it)).slice(0, 2)));
  const lanes = shuffle([19, 50, 81]);
  f.innerHTML = '';
  opts.forEach((it, k) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'bal';
    b.setAttribute('aria-label', '풍선 ' + (k + 1));
    b.style.left = (lanes[k] + Math.random() * 6 - 3).toFixed(1) + '%';
    b.style.setProperty('--c', it.color);
    b.style.animationDuration = (7.5 + Math.random() * 2.5).toFixed(2) + 's';
    b.style.animationDelay = (k * 0.5 + Math.random() * 0.3).toFixed(2) + 's';
    b.innerHTML = '<span class="bal-body">' + glyph(it.c) + '</span>';
    b._it = it;
    b.addEventListener('animationend', ev => {
      if (ev.target !== b || ev.animationName !== 'rise') return;
      b.remove();
      if (run === gameRun && !q.solved && !f.querySelector('.bal')) setTimeout(() => { if (run === gameRun) round(); }, 250);
    });
    f.appendChild(b);
  });
  setTimeout(() => { if (run === gameRun) sayQ(); }, 300);
}
function sayQ() {
  if (!game || game.n >= game.qs.length) return;
  const it = game.qs[game.n].it;
  say(it.c, it.hun + ', ' + it.eum);
}
function renderGDots() {
  $('gDots').innerHTML = game.qs.map((q, i) =>
    '<li class="' + (i < game.n && q.first ? 'done' : '') + (i === game.n ? ' now' : '') + '"></li>'
  ).join('');
}
function popAt(b) {
  const f = $('field'), fr = f.getBoundingClientRect(), br = b.querySelector('.bal-body').getBoundingClientRect();
  const cx = br.left - fr.left + br.width / 2, cy = br.top - fr.top + br.height / 2, c = b.style.getPropertyValue('--c');
  for (let i = 0; i < 10; i++) {
    const sp = document.createElement('span'), a = i / 10 * Math.PI * 2, d = 50 + Math.random() * 30;
    sp.className = 'spark';
    sp.style.left = (cx - 6) + 'px';
    sp.style.top = (cy - 6) + 'px';
    sp.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
    sp.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
    sp.style.setProperty('--c', c);
    f.appendChild(sp);
    setTimeout(() => sp.remove(), 600);
  }
}
function popSound() {
  const a = audio();
  if (!a) return;
  try {
    const len = Math.floor(a.sampleRate * 0.09), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(), g = a.createGain();
    g.gain.value = 0.5;
    src.buffer = buf; src.connect(g); g.connect(a.destination); src.start();
  } catch (e) {}
}
$('field').addEventListener('click', e => {
  const b = e.target.closest('.bal');
  if (!b || !game || b.classList.contains('sad') || b.classList.contains('popped') || b.classList.contains('bye')) return;
  const q = game.qs[game.n], run = gameRun;
  if (!q || q.solved) return;
  if (b._it === q.it) {
    q.solved = true;
    if (q.first) game.score++;
    popAt(b);
    b.classList.add('popped');
    popSound();
    setTimeout(chime, 80);
    [...$('field').querySelectorAll('.bal')].forEach(x => { if (x !== b) x.classList.add('bye'); });
    setTimeout(() => {
      if (run !== gameRun) return;
      game.n++;
      if (game.n < game.qs.length) round(); else endGame();
    }, 1200);
  } else {
    q.first = false;
    b.classList.add('sad');
    boop();
    setTimeout(() => { if (run === gameRun) sayQ(); }, 500);
  }
});
function endGame() {
  gameRun++;
  renderGDots();
  $('field').innerHTML = '';
  $('gStage').hidden = true;
  $('gEnd').hidden = false;
  $('gScore').textContent = game.qs.length + '개 중 ' + game.score + '개를 한 번에 터뜨렸어요';
  const st = $('gStamp');
  st.classList.remove('on'); void st.getBoundingClientRect(); st.classList.add('on');
  setTimeout(() => say('praise', '참 잘했어요!'), 320);
}
function leaveGame() {
  const from = game ? game.from : 'group';
  stopAll();
  $('field').innerHTML = '';
  game = null;
  if (from === 'menu') { renderGameMenu(); show('gmenu'); }
  else { renderGroup(); show('group'); }
}
function renderGameMenu() {
  $('gmGroups').innerHTML = GROUPS.map((g, i) =>
    '<li><button class="group" type="button" data-gg="' + i + '" style="--c:' + g.color + ';--tilt:' + TILTS[(i * 3) % 10] / 2 + 'deg" aria-label="' + g.name + '으로 풍선 터뜨리기">' +
      '<span><span class="gname">' + g.name + '</span><span class="gprog">' + g.items.length + '글자</span></span>' +
      '<span class="samples">' + g.items.slice(0, 3).map(it => glyph(it.c, '')).join('') + '</span>' +
    '</button></li>'
  ).join('');
}
$('gameDoor').addEventListener('click', () => { stopAll(); renderGameMenu(); show('gmenu'); });
$('gmGroups').addEventListener('click', e => {
  const b = e.target.closest('.group');
  if (b) startGame(+b.dataset.gg, 'menu');
});
$('gmHome').addEventListener('click', () => { stopAll(); renderHome(); show('home'); });
$('playBtn').addEventListener('click', () => startGame(gi, 'group'));
$('listen').addEventListener('click', sayQ);
$('again').addEventListener('click', () => startGame(gi, game ? game.from : 'group'));
$('toList').addEventListener('click', leaveGame);
$('gameBack').addEventListener('click', leaveGame);

$('toGroup').addEventListener('click', () => { stopAll(); renderGroup(); show('group'); });
$('say').addEventListener('click', () => { const it = cur(); say(it.c, it.hun + ', ' + it.eum); });
$('watchBtn').addEventListener('click', () => watch());
$('traceBtn').addEventListener('click', () => { try { writer.cancelQuiz(); } catch (e) {} trace(false); });
$('pic').addEventListener('click', tapPic);
$('prev').addEventListener('click', () => { if (idx > 0) openChar(idx - 1); });
$('next').addEventListener('click', () => { if (idx < GROUPS[gi].items.length - 1) openChar(idx + 1); });

let rz = 0;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    if ($('learn').hidden) return;
    if (buildWriter(false)) { flow++; setMode(null); hideStamp(); }
  }, 250);
});

renderHome();
</script>
